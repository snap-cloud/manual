jtex: v1
title: Snap! Manual
description: >
  A locally vendored copy of the MyST plain_latex_book template, adapted for
  the Snap! Reference Manual (US Letter, scrbook, indexed, Snap! brand colors).
version: 1.0.0
license: BSD-2-Clause
source: https://snap.berkeley.edu
authors:
  - name: Michael Ball
    website: https://mball.co
tags:
  - book
parts:
  - id: abstract
    required: false
    description: >
      A short description of the manual.
doc:
  - id: title
    required: true
  - id: subtitle
  - id: authors
    required: true
  - id: bibliography
options:
  - type: boolean
    id: draft
    description: Mark the document as draft
files:
  - template.tex
packages:
  - imakeidx
  - fontenc
  - inputenc
  - lmodern
  - graphicx
  - caption
  - natbib
  - xcolor
  - changepage
  - framed
  - hyperref
  - amssymb
  - enumitem
  - geometry
