block_description: |
  Moves a sprite a set number of steps (one coordinate) in whichever direction the sprite is facing.
label: "move _ steps"
block_spec: "move %n steps"
help_screen: "forward.png"
selector: "forward"
type: command
category: motion
arguments:
  - name: distance
    type: number
    default: 10
    description: The distance to move forward
returns: None
example_projects:
  - title: Move Steps Example 1
    url: 
      https://snap.berkeley.edu/snap/snap.html#present:Username=snapcloud&ProjectName=Move%20Steps%20Example%201&editMode&noRun
  - title: Move Steps Example 2
    url: 
