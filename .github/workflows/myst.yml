name: Deploy MyST / Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MyST
        run: npm install -g mystmd

      - name: Print MyST version
        run: myst --version

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-luatex \
            texlive-xetex

      - name: Build HTML
        run: myst build --html

      - name: Build PDF
        run: myst build --pdf

      - name: Stage PDF for publishing
        run: |
          # The PDF location is configured in myst.yml under exports.output.
          # Copy it into the HTML output so it ships alongside the site.
          mkdir -p _build/html
          cp output/snap-manual.pdf _build/html/snap-manual.pdf

      # On PRs, attach the PDF as a workflow artifact so reviewers can grab a
      # preview without needing to run the build locally. Kept for 10 days to
      # avoid filling up artifact storage.
      - name: Upload PDF artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: snap-manual-pdf
          path: output/snap-manual.pdf
          retention-days: 10
          if-no-files-found: error

      # Only publish to gh-pages from main (or workflow_dispatch). PRs stop
      # after building + uploading the artifact above.
      - name: Publish HTML to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
