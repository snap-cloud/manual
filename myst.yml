# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: e2e8108c-f6b3-443e-8192-e9f0a4b5e752
  title: Snap! Reference Manual
  description: A manual for the Snap! programming language
  keywords:
    - Snap!
    - programming languages
    - blocks-based programming
    - visual programming
  authors:
    - Brian Harvey
    - Jens Mönig
    - Michael Ball
    - Jadga Hügle
    - Victoria Phelps
    - Bernat Romagosa
  github: https://github.com/snap-cloud/manual
  exclude:
    - '**/*.qmd'
    - '**/*.tex'
  myst_substitutions:
    # Snap: '<snap class="snap">Snap<em>!</em></span>'
    # Snap: '{span .snap}`Snap!`'
    Snap: 'Test Snap!'
    SnapHTML: '<span class="snap">Snap<em>!</em></span>'
  exports:
  - format: tex+pdf
    title: Snap\textit{!} Reference Manual
    template: ./_latex-template/
    output: output/snap-manual.pdf

extends:
  - toc.yml

site:
  template: book-theme
  numbered-references: true
  options:
    style: _support/styles/snap-manual.css
    favicon: images/favicon.png
    logo: images/snap-logo.png
